services:
  postgres:
    image: postgres:16
    container_name: opsflow-db
    environment:
      POSTGRES_DB: opsflow
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: opsflow123
    volumes:
      - opsflow-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: opsflow-app-compose
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opsflow
      SPRING_DATASOURCE_USERNAME: opsflow
      SPRING_DATASOURCE_PASSWORD: opsflow123
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: opsflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:latest
    container_name: opsflow-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: opsflow-grafana
    depends_on:
      - prometheus

volumes:
  opsflow-data:

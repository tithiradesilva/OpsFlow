name: OpsFlow CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          echo "Preparing SSH..."

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          echo "SSH directory created"
          echo "Checking SSH key secret..."

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is empty"
            exit 1
          fi

          echo "SSH key secret is present"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/opsflow-key.pem"
          chmod 600 "$HOME/.ssh/opsflow-key.pem"

          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

          echo "Connecting to EC2..."

          ssh -i "$HOME/.ssh/opsflow-key.pem" \
            "$EC2_USER@$EC2_HOST" << 'REMOTE_COMMANDS'

          set -e

          cd ~/OpsFlow

          echo "Updating application..."
          git fetch origin
          git checkout development
          git pull origin development

          echo "Building latest application JAR..."
          mvn clean package -DskipTests

          echo "Building and starting containers..."
          docker compose up -d --build

          echo "Waiting for application health..."

          HEALTHY=false

          for i in $(seq 1 30); do
            if curl -fsS http://localhost/actuator/health > /dev/null; then
              HEALTHY=true
              break
            fi

            echo "Waiting for application... ($i/30)"
            sleep 2
          done

          if [ "$HEALTHY" = true ]; then
            echo "Deployment successful"
          else
            echo "Deployment health check failed"
            exit 1
          fi

          REMOTE_COMMANDS
